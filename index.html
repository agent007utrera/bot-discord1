<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habitación Interactiva</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    #escenario {
      position: relative;
      width: 700px;
      height: 450px;
      background: #333 url('https://picsum.photos/id/1018/700/450') no-repeat center/cover;
      border: 4px solid #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .objeto-suelo {
      position: absolute;
      padding: 8px 12px;
      background-color: rgba(255, 204, 0, 0.9);
      color: #000;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
    }
    .objeto-suelo:hover {
      transform: scale(1.1);
    }

    #obj_llave { top: 300px; left: 150px; }
    #obj_antorcha { top: 120px; left: 500px; }
    #obj_pocion { top: 250px; left: 380px; }

    #panel-inventario {
      width: 700px;
      margin-top: 20px;
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .lista-items {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .item-card {
      background: #444;
      padding: 10px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-card button {
      background: #ff4444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    .item-card button:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>

  <h1>Habitación Multijugador</h1>
  
  <div id="escenario">
    <div id="obj_llave" class="objeto-suelo" onclick="recogerObjeto('llave')">🔑 Llave</div>
    <div id="obj_antorcha" class="objeto-suelo" onclick="recogerObjeto('antorcha')">🔦 Antorcha</div>
    <div id="obj_pocion" class="objeto-suelo" onclick="recogerObjeto('pocion')">🧪 Poción</div>
  </div>

  <div id="panel-inventario">
    <h3>Mi Inventario (<span id="mi-id-display"></span>)</h3>
    <div id="contenedor-inventario" class="lista-items">
      <p style="color: #aaa;">Tu inventario está vacío.</p>
    </div>
  </div>

  <script>
    const jugadorId = "Jugador_" + Math.floor(1000 + Math.random() * 9000);
    document.getElementById('mi-id-display').textContent = jugadorId;

    // Canal de comunicación en tiempo real entre ventanas/pestañas
    const canalSincronizacion = new BroadcastChannel('habitacion_game_channel');

    // Estado inicial de la sala
    let estadoObjetos = JSON.parse(localStorage.getItem('habitacion_objetos')) || {
      llave: { enSuelo: true, dueno: null },
      antorcha: { enSuelo: true, dueno: null },
      pocion: { enSuelo: true, dueno: null }
    };

    function guardarYNotificar() {
      localStorage.setItem('habitacion_objetos', JSON.stringify(estadoObjetos));
      canalSincronizacion.postMessage(estadoObjetos);
      renderizarEscenario();
    }

    function renderizarEscenario() {
      const listaObjetos = ['llave', 'antorcha', 'pocion'];
      const misItems = [];

      listaObjetos.forEach(item => {
        const elementoDOM = document.getElementById('obj_' + item);
        const infoItem = estadoObjetos[item];

        if (infoItem && !infoItem.enSuelo) {
          elementoDOM.style.display = 'none';
          if (infoItem.dueno === jugadorId) {
            misItems.push(item);
          }
        } else {
          elementoDOM.style.display = 'block';
        }
      });

      actualizarInventarioUI(misItems);
    }

    function recogerObjeto(nombreItem) {
      if (estadoObjetos[nombreItem] && estadoObjetos[nombreItem].enSuelo) {
        estadoObjetos[nombreItem] = {
          enSuelo: false,
          dueno: jugadorId
        };
        guardarYNotificar();
      }
    }

    function soltarObjeto(nombreItem) {
      if (estadoObjetos[nombreItem] && estadoObjetos[nombreItem].dueno === jugadorId) {
        estadoObjetos[nombreItem] = {
          enSuelo: true,
          dueno: null
        };
        guardarYNotificar();
      }
    }

    function actualizarInventarioUI(items) {
      const contenedor = document.getElementById('contenedor-inventario');
      if (items.length === 0) {
        contenedor.innerHTML = '<p style="color: #aaa;">Tu inventario está vacío.</p>';
        return;
      }

      contenedor.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <span><b>${item.toUpperCase()}</b></span>
          <button onclick="soltarObjeto('${item}')">Tirar al suelo</button>
        `;
        contenedor.appendChild(card);
      });
    }

    // Escuchar actualizaciones enviadas por otras ventanas/pestañas
    canalSincronizacion.onmessage = (event) => {
      estadoObjetos = event.data;
      renderizarEscenario();
    };

    // Renderizado inicial al cargar la página
    renderizarEscenario();
  </script>
</body>
</html>
